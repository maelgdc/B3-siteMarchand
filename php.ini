# A quoi cela sert ? A définir où les logs doivent être stockés
log_errors = On
error_log = ./log/php-errors.log

# A quoi cela sert ? A dire si les erreurs doivent être affichées dans la console
display_errors = On
display_startup_errors = On

# A quoi cela sert ? Définit quel niveau d'erreur est pris en compte
error_reporting = E_ALL

# A quoi cela sert ? Définie si les messages répétitifs seront enregistrés
ignore_repeated_errors = On
ignore_repeated_source = Off

# A quoi cela sert ? Définie la taille maximale des erreurs 
log_errors_max_len = 0
